name: Deploy site (staging)

# Builds the site and uploads dist/ to the staging bunny.net storage zone
# (shroud-email-website-staging), then purges the staging pull zone cache.
# The middleware edge script attached to the staging pull zone rewrites the
# price based on the visitor's country.
#
# Manual only — run from the Actions tab.
#
# Required repo secrets:
#   BUNNY_STAGING_STORAGE_PASSWORD - staging storage zone read/write password
#   BUNNY_STAGING_PULLZONE_ID      - staging pull zone id (for cache purge)
#   BUNNY_API_KEY                  - account API key (for cache purge)

on:
  workflow_dispatch:

# Prevent two manual runs from racing to upload to the same storage zone.
concurrency:
  group: deploy-site-staging
  cancel-in-progress: true

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: node scripts/deploy-bunny.mjs
        env:
          BUNNY_STORAGE_ZONE: shroud-email-website-staging
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STAGING_STORAGE_PASSWORD }}
          BUNNY_PULLZONE_ID: ${{ secrets.BUNNY_STAGING_PULLZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
